[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends.legacy:BuildBackend"

[project]
name = "mtg-wizard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "scrython>=1.9.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.1",
]

[project.scripts]
wizard = "wizard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
